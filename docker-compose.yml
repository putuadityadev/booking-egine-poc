services:
  poc-backend:
    container_name: poc-booking-backend
    image: bitnami/laravel:12
    working_dir: /app
    env_file:
      - ./backend/.env
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app:delegated
    command: php artisan serve --host=0.0.0.0 --port=8000
    networks:
      - app-network

  poc-frontend:
    container_name: poc-booking-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network

networks:
  app-network:
    external: true
